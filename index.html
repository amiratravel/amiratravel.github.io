<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AmiraTravel — Best Hotel Deals in the world</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; padding: 30px 16px 50px;
    position: relative;
  }
  .bg-image {
    position: fixed; inset: 0; z-index: 0;
    background-image: url('https://images.unsplash.com/photo-1530521954074-e64f6810b32d?auto=format&fit=crop&w=1920&q=80');
    background-size: cover; background-position: center;
    filter: brightness(0.35);
  }
  .content { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; width: 100%; }
  .avatar {
    width: 80px; height: 80px; border-radius: 50%;
    background: linear-gradient(135deg, #f7971e, #ffd200);
    display: flex; align-items: center; justify-content: center;
    font-size: 36px; margin-bottom: 12px;
    box-shadow: 0 4px 20px rgba(247,151,30,0.5);
  }
  h1 { color: #fff; font-size: 20px; font-weight: 700; letter-spacing: 1px; text-shadow: 0 2px 8px rgba(0,0,0,0.6); }
  .bio { color: #d0e8f5; font-size: 12px; margin-top: 5px; text-align: center; max-width: 300px; line-height: 1.6; text-shadow: 0 1px 4px rgba(0,0,0,0.6); }
  .divider { width: 40px; height: 2px; background: linear-gradient(90deg, #f7971e, #ffd200); border-radius: 2px; margin: 18px 0; }
  .links-container { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 10px; }
  .section-title { color: #ffd200; font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 6px; text-align: center; text-shadow: 0 1px 4px rgba(0,0,0,0.6); }
  .link-btn {
    display: flex; align-items: center; gap: 12px;
    background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.18);
    border-radius: 14px; padding: 13px 18px;
    color: #fff; font-size: 14px; font-weight: 600;
    cursor: pointer; width: 100%; transition: all 0.2s ease;
    backdrop-filter: blur(12px);
    text-shadow: 0 1px 3px rgba(0,0,0,0.4);
  }
  .link-btn:hover { background: rgba(255,255,255,0.22); transform: translateY(-2px); border-color: rgba(255,210,0,0.5); box-shadow: 0 6px 24px rgba(0,0,0,0.4); }
  .link-btn .flag { font-size: 22px; }
  .link-btn .text { flex: 1; text-align: left; }
  .link-btn .text small { display: block; font-size: 10px; font-weight: 400; color: #aecde0; margin-top: 1px; }
  .link-btn .arrow { color: #ffd200; font-size: 16px; }
  .highlight { background: linear-gradient(135deg, rgba(247,151,30,0.25), rgba(255,210,0,0.15)); border-color: rgba(247,151,30,0.5); }
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 1000; flex-direction: column; align-items: center; justify-content: center; padding: 16px; }
  .modal-overlay.active { display: flex; }
  .modal-box { background: #1a2a3a; border-radius: 16px; width: 100%; max-width: 900px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
  .modal-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; background: linear-gradient(135deg, #f7971e, #ffd200); }
  .modal-title { font-weight: 700; font-size: 15px; color: #1a2a3a; }
  .modal-close { background: rgba(0,0,0,0.2); border: none; border-radius: 50%; width: 30px; height: 30px; cursor: pointer; font-size: 16px; color: #1a2a3a; font-weight: bold; display: flex; align-items: center; justify-content: center; }
  .modal-close:hover { background: rgba(0,0,0,0.3); }
  .map-frame { width: 100%; height: 500px; border: none; display: block; }
  .footer { margin-top: 30px; color: rgba(255,255,255,0.35); font-size: 10px; text-shadow: 0 1px 3px rgba(0,0,0,0.5); }
</style>
</head>
<body>

<div class="bg-image"></div>

<div class="content">
  <div class="avatar">✈️</div>
  <h1>amiratravel</h1>
  <p class="bio">🏨 Best hotel deals to discover the world<br>Compare Booking, Airbnb & more</p>
  <div class="divider"></div>

  <div class="links-container">
    <p class="section-title">🔥 All World</p>
    <button class="link-btn highlight" onclick="openMap('All World','Lucerne, Switzerland')">
      <span class="flag">🌍</span>
      <span class="text">All World — Best Deals<small>Compare all platforms</small></span>
      <span class="arrow">›</span>
    </button>

    <p class="section-title" style="margin-top:8px;">🗺️ By Country</p>

    <button class="link-btn" onclick="openMap('Austria','Vienna, Austria')">
      <span class="flag">🇦🇹</span>
      <span class="text">Austria — Hotels<small>Vienna · Salzburg · Innsbruck</small></span>
      <span class="arrow">›</span>
    </button>
    <button class="link-btn" onclick="openMap('Germany','Berlin, Germany')">
      <span class="flag">🇩🇪</span>
      <span class="text">Germany — Hotels<small>Berlin · Munich · Hamburg</small></span>
      <span class="arrow">›</span>
    </button>
    <button class="link-btn" onclick="openMap('Italy','Rome, Italy')">
      <span class="flag">🇮🇹</span>
      <span class="text">Italy — Hotels<small>Rome · Florence · Venice</small></span>
      <span class="arrow">›</span>
    </button>
    <button class="link-btn" onclick="openMap('Spain','Barcelona, Spain')">
      <span class="flag">🇪🇸</span>
      <span class="text">Spain — Hotels<small>Barcelona · Madrid · Seville</small></span>
      <span class="arrow">›</span>
    </button>
    <button class="link-btn" onclick="openMap('France','Paris, France')">
      <span class="flag">🇫🇷</span>
      <span class="text">France — Hotels<small>Paris · Nice · Lyon</small></span>
      <span class="arrow">›</span>
    </button>
    <button class="link-btn" onclick="openMap('Greece','Athens, Greece')">
      <span class="flag">🇬🇷</span>
      <span class="text">Greece — Hotels<small>Athens · Santorini · Mykonos</small></span>
      <span class="arrow">›</span>
    </button>
    <button class="link-btn" onclick="openMap('Switzerland','Zurich, Switzerland')">
      <span class="flag">🇨🇭</span>
      <span class="text">Switzerland — Hotels<small>Zurich · Geneva · Lucerne</small></span>
      <span class="arrow">›</span>
    </button>
    <button class="link-btn" onclick="openMap('Turkey','Istanbul, Turkey')">
      <span class="flag">🇹🇷</span>
      <span class="text">Türkiye — Hotels<small>Istanbul · Antalya · Cappadocia</small></span>
      <span class="arrow">›</span>
    </button>
    <button class="link-btn" onclick="openMap('Morocco','Tanger, Morocco')">
      <span class="flag">MAR</span>
      <span class="text">Morocco — Hotels<small>Marrakech · Agadir · Tanger</small></span>
      <span class="arrow">›</span>
    </button>
  </div>

  <p class="footer">Best prices · No extra fees · Instant booking · Powered by Stay22</p>
</div>

<div class="modal-overlay" id="mapModal" onclick="closeOnOverlay(event)">
  <div class="modal-box">
    <div class="modal-header">
      <span class="modal-title" id="modalTitle">Hotels</span>
      <button class="modal-close" onclick="closeMap()">✕</button>
    </div>
    <iframe class="map-frame" id="mapFrame" src="" allowfullscreen></iframe>
  </div>
</div>

<script>
  function openMap(title, address) {
    document.getElementById('modalTitle').textContent = title + ' — Best Hotel Deals';
    document.getElementById('mapFrame').src = 'https://www.stay22.com/embed/gm?aid=amiratravel&address=' + encodeURIComponent(address);
    document.getElementById('mapModal').classList.add('active');
    document.body.style.overflow = 'hidden';
  }
  function closeMap() {
    document.getElementById('mapModal').classList.remove('active');
    document.getElementById('mapFrame').src = '';
    document.body.style.overflow = '';
  }
  function closeOnOverlay(e) { if (e.target === document.getElementById('mapModal')) closeMap(); }
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMap(); });
</script>
</body>
</html>
